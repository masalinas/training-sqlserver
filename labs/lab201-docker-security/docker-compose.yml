version: '3.8'

services:
  sql-server-training:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: sql-server-training
    hostname: sql-server-training
    user: "root"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql/data
      - sqlbackups:/var/opt/mssql/backup

volumes:
  sqldata:
  sqlbackups:
